<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="꼬마 로봇 마스코트 코코">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efff"/><stop offset="1" stop-color="#cdbdff"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ddd2ff"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3566"/><stop offset="1" stop-color="#262245"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb800"/></radialGradient>
  </defs>
  <ellipse cx="120" cy="248" rx="62" ry="9" fill="#2b2d42" opacity=".12"/>
  <!-- antenna -->
  <path d="M120 44 V22" stroke="#9c86ff" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 2 l6 12 13 2 -9.5 9 2.3 13 -11.8-6.2 -11.8 6.2 2.3-13 -9.5-9 13-2z" fill="url(#glow)" stroke="#f0a500" stroke-width="2" stroke-linejoin="round"/>
  <!-- ears -->
  <rect x="18" y="82" width="26" height="50" rx="13" fill="#7fe0c3" stroke="#5cc4a6" stroke-width="3"/>
  <rect x="196" y="82" width="26" height="50" rx="13" fill="#7fe0c3" stroke="#5cc4a6" stroke-width="3"/>
  <!-- arms -->
  <path d="M58 182 q-30 6 -36 -22" stroke="#b9a6ff" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="158" r="13" fill="#7fe0c3" stroke="#5cc4a6" stroke-width="3"/>
  <path d="M182 182 q30 4 38 -30" stroke="#b9a6ff" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="220" cy="150" r="13" fill="#7fe0c3" stroke="#5cc4a6" stroke-width="3"/>
  <!-- body -->
  <rect x="62" y="158" width="116" height="80" rx="34" fill="url(#body)" stroke="#a892ff" stroke-width="3"/>
  <path d="M120 180 c-9-12 -26-2 -16 10 l16 15 16-15 c10-12 -7-22 -16-10z" fill="#ff8fb1"/>
  <!-- head -->
  <rect x="34" y="42" width="172" height="130" rx="54" fill="url(#head)" stroke="#a892ff" stroke-width="3"/>
  <rect x="54" y="62" width="132" height="90" rx="38" fill="url(#screen)"/>
  <ellipse cx="78" cy="74" rx="14" ry="5" fill="#fff" opacity=".18" transform="rotate(-20 78 74)"/>
  <!-- face -->
  <ellipse cx="94" cy="104" rx="12" ry="15" fill="#7fe0c3"/>
  <ellipse cx="146" cy="104" rx="12" ry="15" fill="#7fe0c3"/>
  <circle cx="98" cy="98" r="4.5" fill="#fff"/><circle cx="150" cy="98" r="4.5" fill="#fff"/>
  <path d="M106 128 q14 13 28 0" stroke="#ffe066" stroke-width="5" stroke-linecap="round" fill="none"/>
  <ellipse cx="72" cy="128" rx="10" ry="6" fill="#ff8fb1" opacity=".75"/>
  <ellipse cx="168" cy="128" rx="10" ry="6" fill="#ff8fb1" opacity=".75"/>
