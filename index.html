<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꼬마 AI 창작 연구소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--muted:#6b7090;--main:#7c5cff;--soft:#efeaff;--deep:#5a3ee0;--cream:#fff7ea}
*{box-sizing:border-box}
body{margin:0;font-family:'Gowun Dodum','Malgun Gothic',sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,#d7f6ec 0,transparent 38%),radial-gradient(circle at 92% 22%,#ece4ff 0,transparent 40%),radial-gradient(circle,rgba(124,92,255,.08) 1.5px,transparent 1.6px) 0 0/26px 26px,var(--cream);min-height:100vh;overflow-x:hidden}
h1,h2,h3,button,.jua,.badge,.step{font-family:'Jua',sans-serif;font-weight:400}
a{color:inherit;text-decoration:none}
.cloud{position:fixed;background:#fff;border-radius:999px;opacity:.8;z-index:-1;animation:drift 45s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:180px;height:56px;top:14%;left:-220px}.c1::before{width:80px;height:80px;top:-40px;left:30px}.c1::after{width:60px;height:60px;top:-28px;left:95px}
.c2{width:240px;height:70px;top:58%;left:-280px;animation-duration:65s;animation-delay:-25s}.c2::before{width:100px;height:100px;top:-55px;left:40px}.c2::after{width:80px;height:80px;top:-38px;left:125px}
@keyframes drift{to{transform:translateX(calc(100vw + 320px))}}
@keyframes bob{50%{transform:translateY(-12px)}}
.wrap{width:min(1200px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:rgba(255,255,255,.65);border-bottom:3px solid rgba(255,255,255,.9)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Jua';font-size:clamp(19px,3vw,26px)}
.logo img{width:50px;height:54px;filter:drop-shadow(0 4px 0 rgba(90,62,224,.15));animation:bob 3s ease-in-out infinite}
nav{display:flex;gap:10px}
.nav-btn{display:inline-block;border:0;padding:11px 18px;border-radius:999px;background:#fff;font-family:'Jua';font-size:17px;box-shadow:0 5px 0 #d9dcef;cursor:pointer;transition:.15s;white-space:nowrap}
.nav-btn:hover{transform:translateY(-2px)}.nav-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d9dcef}
.nav-btn.on{background:#7c5cff;color:#fff;box-shadow:0 5px 0 #5a3ee0}
main{padding:24px 0 80px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.step{background:rgba(255,255,255,.85);padding:8px 16px;border-radius:999px;font-size:16px;color:var(--muted)}
.step.now{background:#ffd84d;color:var(--ink);box-shadow:0 4px 0 #e6b800}.step.done{color:#2f9e6b}
.art{position:relative;display:grid;place-items:center;overflow:hidden}
.art .emo{font-size:110px;filter:drop-shadow(0 10px 0 rgba(0,0,0,.08));animation:bob 3s ease-in-out infinite}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 첫 화면 */
.hero{position:relative;border-radius:40px;overflow:hidden;background:#cfeee4;box-shadow:0 12px 0 #a9dccb;aspect-ratio:1376/768;max-height:620px;width:100%}
.hero>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center}
.hero-txt{position:absolute;left:4%;top:50%;transform:translateY(-50%);width:38%}
.hi{display:inline-block;background:#fff;padding:8px 16px;border-radius:999px;font-family:'Jua';font-size:clamp(14px,1.5vw,18px);color:#2f9e83;box-shadow:0 4px 0 #a9dccb}
.hero h1{font-size:clamp(30px,4.3vw,56px);margin:14px 0 10px;line-height:1.18;color:var(--ink);text-shadow:0 3px 0 #fff}
.hero h1 em{font-style:normal;color:#7c5cff;background:linear-gradient(transparent 60%,#ffe066 60%)}
.hero .btn{width:auto;display:inline-block;padding:14px 26px;margin-top:6px}
.bubble{position:absolute;right:2.5%;bottom:5%;display:flex;align-items:flex-end;gap:6px}
.bubble img{width:clamp(70px,9vw,118px);animation:bob 3s ease-in-out infinite}
.bubble span{background:#fff;border-radius:20px 20px 4px 20px;padding:10px 14px;font-family:'Jua';font-size:clamp(13px,1.4vw,17px);box-shadow:0 4px 0 #dcd3ff;margin-bottom:70px;white-space:nowrap}
.intro .sec-title{margin:34px 0 16px}
.player{background:#fff;border-radius:36px;padding:12px;box-shadow:0 12px 0 #f3d9a4;max-width:960px;margin:auto}
.player video{display:block;width:100%;aspect-ratio:16/9;border-radius:26px;background:#fdf3e2}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0 8px}
.flow div{background:#fff;border-radius:26px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 #e6e1f7}
.flow i{font-style:normal;flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px}
.flow b{display:block;font-family:'Jua';font-weight:400;font-size:20px}.flow small{color:var(--muted);font-size:14px}
.sec-title{scroll-margin-top:96px;font-size:clamp(26px,3.5vw,38px);margin:36px 0 18px;display:flex;align-items:baseline;flex-wrap:wrap;gap:10px}
.sec-title small{font-family:'Gowun Dodum';font-size:16px;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.big{position:relative;border-radius:36px;overflow:hidden;background:#fff;box-shadow:0 12px 0 var(--deep);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;border:5px solid #fff}
.big:hover{transform:translateY(-6px) rotate(-.6deg)}.big:active{transform:translateY(8px);box-shadow:0 4px 0 var(--deep)}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:repeat(3,1fr);gap:5px;height:300px}
.mosaic .art{background:var(--soft);border-radius:22px}.mosaic .art:first-child{grid-row:1/4}.mosaic .emo{font-size:40px}.mosaic .art:first-child .emo{font-size:110px}
.big .txt{padding:18px 22px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.big h2{margin:0;font-size:36px;color:var(--deep)}.big p{margin:4px 0 0;color:var(--muted);font-size:16px}
.go{flex:none;width:62px;height:62px;border-radius:50%;background:var(--main);color:#fff;font-size:30px;display:grid;place-items:center;font-family:'Jua';transition:.2s;box-shadow:0 5px 0 var(--deep)}
.big:hover .go{transform:translateX(6px)}
.tag{position:absolute;top:14px;left:14px;z-index:2;background:#fff;padding:7px 15px;border-radius:999px;font-family:'Jua';color:var(--deep);box-shadow:0 4px 0 var(--soft)}
.count{position:absolute;top:14px;right:14px;z-index:2;background:var(--main);color:#fff;padding:7px 13px;border-radius:999px;font-family:'Jua';font-size:15px}
/* 공통 띠 */
.back{margin:4px 0 18px}
.band{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:center;background:var(--soft);border-radius:36px;padding:24px;box-shadow:0 10px 0 var(--deep);position:relative;overflow:hidden}
.band::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.45)}
.faces{display:flex;margin-top:14px}.faces img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:4px solid #fff;margin-left:-12px;box-shadow:0 3px 0 rgba(0,0,0,.06)}.faces img:first-child{margin-left:0}
.band .art{height:180px;border-radius:30px;background:#fff;border:5px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.06)}.band .emo{font-size:84px}
.band h1{margin:6px 0 8px;font-size:clamp(28px,4vw,44px);color:var(--deep)}.band p{margin:0;font-size:18px;color:var(--muted)}
/* 직업 */
.jobs{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:34px}
.job{background:#fff;border-radius:30px;overflow:hidden;box-shadow:0 10px 0 #dfe3f3;transition:.2s;display:flex;flex-direction:column}
.job:hover{transform:translateY(-8px);box-shadow:0 14px 0 var(--main)}
.job{border:5px solid #fff}.job .pic{position:relative}.job .art{aspect-ratio:1/1;background:var(--soft);border-radius:24px}.job .emo{font-size:86px}
.job .no{position:absolute;top:10px;left:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;font-family:'Jua';font-size:20px;box-shadow:0 3px 0 var(--soft)}
.job .body{padding:14px 16px 18px;flex:1;display:flex;flex-direction:column}
.job h3{margin:0 0 6px;font-size:23px;color:var(--deep)}.job p{margin:0 0 10px;color:var(--muted);font-size:15px;line-height:1.6}
.job ul{margin:0 0 16px;padding-left:20px;font-size:15px;line-height:1.8}
.cta{margin-top:auto;background:var(--main);color:#fff;border-radius:16px;padding:12px;text-align:center;font-family:'Jua';font-size:18px}
/* 실습 */
.lab{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;margin-top:30px;align-items:start}
.panel{background:#fff;border-radius:32px;padding:28px;box-shadow:0 10px 0 #dfe3f3}
.group{margin-bottom:24px}.group h3{margin:0 0 12px;font-size:22px;display:flex;align-items:center;gap:10px}
.num{width:34px;height:34px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:3px solid #eceef8;background:#fafbff;border-radius:999px;padding:10px 17px;font-size:17px;cursor:pointer;transition:.12s;color:var(--ink)}
.chip:hover{border-color:var(--main)}.chip.sel{background:var(--main);border-color:var(--main);color:#fff;transform:scale(1.06)}
textarea,input,select{width:100%;border:3px solid #eceef8;border-radius:18px;padding:12px 14px;font-family:inherit;font-size:16px;background:#fafbff;margin-bottom:12px}
.sticky{position:sticky;top:96px}.sticky h3{margin:0 0 12px;font-size:24px}
.prompt{background:#2b2d42;color:#fff;border-radius:22px;padding:20px;white-space:pre-wrap;font-size:16px;line-height:1.75;min-height:190px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:18px;padding:14px 18px;font-size:19px;cursor:pointer;color:#fff;background:var(--main);box-shadow:0 6px 0 var(--deep);margin-top:14px;transition:.12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--deep)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #dfe3f3;border:3px solid #eceef8}
.btn.yellow{background:#ffc93c;color:var(--ink);box-shadow:0 6px 0 #e0a800}
.tip{font-size:14px;color:var(--muted);line-height:1.7;margin:16px 0 0}
.multi{font-family:'Gowun Dodum';font-size:13px;color:var(--deep);background:var(--soft);padding:3px 10px;border-radius:999px}
.chip.mine{border-style:dashed;border-color:var(--main);color:var(--deep);background:#fff}.chip.mine.sel{background:var(--main);color:#fff}
.own{margin:12px 0 0;border-color:var(--main);background:#fff}
.meter{height:12px;border-radius:999px;background:#eceef8;overflow:hidden}.meter span{display:block;height:100%;width:0;background:var(--main);border-radius:999px;transition:width .3s}
.cnt{margin:8px 0 12px;font-size:14px;color:var(--muted)}
.prompt{max-height:46vh;overflow:auto;font-size:15px}
.row2.even{grid-template-columns:1fr 1fr}.row2.even .btn{font-size:17px;padding:12px 8px}
.howto{margin-top:18px;background:var(--soft);border-radius:20px;padding:14px 16px;font-size:14px;line-height:1.7}.howto b{font-family:'Jua';font-weight:400;font-size:17px;color:var(--deep)}.howto ol{margin:6px 0 0;padding-left:20px}
/* 게시판 */
.board-head{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:16px;margin-bottom:18px}
.board-head h1{margin:0 0 6px;font-size:clamp(30px,4.5vw,50px)}.board-head p{margin:0;font-size:18px;color:var(--muted)}
.board-head .btn{width:auto;margin:0;padding:14px 26px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.scratch-upload{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px;padding:18px;background:#fff;border:3px solid #d7f0e2;border-radius:24px;box-shadow:0 7px 0 #dfe3f3}
.scratch-upload h2{grid-column:1/-1;margin:0;font-size:23px;color:#258252}
.scratch-upload p{grid-column:1/-1;margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.scratch-upload label{display:block;margin-bottom:6px;font-family:'Jua';font-size:16px}
.scratch-upload input,.scratch-upload textarea{margin:0;background:#fff;border-width:2px}
.scratch-upload .file-field,.scratch-upload button{grid-column:1/-1}
.scratch-upload button{border:0;border-radius:16px;padding:13px 18px;background:#2fbf71;color:#fff;font-family:'Jua';font-size:19px;box-shadow:0 5px 0 #1f9555;cursor:pointer}
.scratch-upload button:disabled{opacity:.65;cursor:wait}
.board-status{grid-column:1/-1;margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.post-download{display:inline-block;margin-top:12px;padding:9px 14px;border-radius:999px;background:#ddf7e8;color:#1f7c4d;font-family:'Jua';font-size:16px}
.posts{columns:3 280px;column-gap:22px}
.post{break-inside:avoid;background:#fff;border-radius:26px;overflow:hidden;margin-bottom:22px;box-shadow:0 8px 0 #dfe3f3}
.post>img{width:100%;display:block}.noimg{height:150px;display:grid;place-items:center;font-size:70px;background:var(--soft)}
.pb{padding:16px 18px 18px}
.badge{display:inline-block;padding:5px 13px;border-radius:999px;font-size:14px;background:var(--soft);color:var(--deep)}
.post h3{margin:10px 0 4px;font-size:22px}.by{color:var(--muted);font-size:14px}.post p{line-height:1.6;margin:10px 0 0}
details{margin-top:10px;font-size:14px;color:var(--muted)}summary{cursor:pointer}pre{white-space:pre-wrap;font-family:inherit;background:#f5f6fb;padding:10px;border-radius:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.like{border:0;background:#fff0f3;color:#ff4d7a;border-radius:999px;padding:8px 16px;font-size:17px;cursor:pointer}.like.done{background:#ff4d7a;color:#fff}
.del{border:0;background:none;color:#b0b4c8;cursor:pointer;font-size:13px;font-family:inherit}
.empty{column-span:all;text-align:center;padding:60px 20px;background:rgba(255,255,255,.75);border-radius:30px;font-size:21px;line-height:1.7}
/* 모달·토스트 */
.modal{position:fixed;inset:0;background:rgba(43,45,66,.5);display:none;place-items:center;z-index:50;padding:16px}.modal.open{display:grid}
.sheet{background:#fff;border-radius:32px;padding:28px;width:min(520px,100%);max-height:92vh;overflow:auto}.sheet h2{margin:0 0 16px;font-size:28px}
.drop{display:block;border:3px dashed #cfd3ea;border-radius:20px;padding:24px;text-align:center;cursor:pointer;color:var(--muted);margin-bottom:12px;font-size:17px}
.drop img{max-width:100%;border-radius:14px}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,120px);background:#2b2d42;color:#fff;padding:14px 24px;border-radius:999px;font-family:'Jua';font-size:18px;transition:.3s;z-index:60}
#toast.show{transform:translate(-50%,0)}
footer{text-align:center;color:var(--muted);padding:20px 0 40px;font-size:14px}
@media(max-width:1000px){.flow{grid-template-columns:1fr}.mosaic{height:240px}.jobs{grid-template-columns:repeat(2,1fr)}.lab{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:760px){.hero{aspect-ratio:auto;max-height:none;display:flex;flex-direction:column}.hero>img.bg{position:static;aspect-ratio:1376/768;height:auto}.hero-txt{position:static;transform:none;width:auto;padding:20px 20px 24px;text-align:center}.hero .steps{justify-content:center}.bubble{display:none}}
@media(max-width:700px){.pick,.jobs{grid-template-columns:1fr}.band{grid-template-columns:1fr;text-align:center}.band .art{width:180px;margin:auto}.faces{justify-content:center}.big h2{font-size:30px}.logo span{display:none}nav .nav-btn{padding:10px 13px;font-size:15px}.scratch-upload{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<header><div class="wrap">
  <a class="logo" href="#/"><img src="images/mascot.svg" alt=""><span>꼬마 AI 창작 연구소</span></a>
  <nav><a class="nav-btn" data-n="home" href="#/">🏠 처음 화면</a><a class="nav-btn" data-n="board" href="#/board">🏆 작품 게시판</a></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer>꼬마 AI 창작 연구소 · AI와 함께 상상을 작품으로 ✨</footer>

<div class="modal" id="modal"><form class="sheet" id="form">
  <h2>🖼️ 내 작품 올리기</h2>
  <label class="drop"><input type="file" id="file" accept="image/*" hidden><span id="dropTxt"></span></label>
  <select id="fCat"></select>
  <input id="fName" placeholder="이름 또는 별명 (예: 3반 별빛)" maxlength="20" required>
  <input id="fTitle" placeholder="작품 제목" maxlength="30" required>
  <textarea id="fDesc" rows="3" placeholder="작품 소개 한마디" maxlength="200"></textarea>
  <div class="row2"><button type="button" class="btn ghost" id="cancel">취소</button><button class="btn yellow">올리기 🎉</button></div>
</form></div>
<div id="toast"></div>

<script src="./supabase-config.js"></script>
<script>
const TEACHER_PIN = '1234'; // 게시물 삭제용 선생님 비밀번호 (꼭 바꿔 주세요)
// 질문 카드: G(질문, 주문서에 들어갈 이름, 보기, {multi: 여러 개 고르기, ph: 직접 쓰기 예시})
// 보기가 없는 질문은 직접 쓰는 칸만 보여요. 모든 질문에 '✏️ 직접 쓰기'가 붙어요.
const G = (t, k, o, f = {}) => ({t, k, o, ...f});
const who = ['🐶 꼬리를 흔드는 강아지','🐱 호기심 많은 아기 고양이','🤖 동글동글 꼬마 로봇','🦖 초록색 아기 공룡','🧚 반짝이는 날개의 요정','🧑‍🚀 어린이 우주비행사','🐼 대나무를 좋아하는 판다','👧 나를 닮은 어린이'];
const look = ['🎩 빨간 모자를 쓴','🎒 노란 가방을 멘','👓 동그란 안경을 쓴','🦸 망토를 두른','👑 작은 왕관을 쓴','🧣 줄무늬 목도리를 한','👟 반짝이는 운동화를 신은'];
const where = ['🏫 햇살 가득한 우리 교실','🌊 산호초와 물고기가 있는 바닷속','🚀 별이 반짝이는 우주 정거장','🍄 버섯 집이 있는 마법의 숲','🍭 사탕 나무가 자라는 과자 나라','🏙️ 하늘을 나는 차가 다니는 미래 도시','🎠 꽃이 핀 놀이공원','🏔️ 눈 덮인 산꼭대기'];
const when = ['☀️ 맑은 아침','🌇 노을 지는 저녁','🌙 별이 가득한 밤','🌧️ 비가 내리는 날','❄️ 눈이 펑펑 오는 날','🌸 벚꽃이 날리는 봄날'];
const mood = ['😆 신나고 활기찬','🥰 따뜻하고 포근한','😮 신비롭고 궁금한','😂 웃기고 엉뚱한','🌙 잔잔하고 평화로운','⚡ 두근두근 긴장되는','🦸 용감하고 씩씩한'];

async function boardRequest(body){
  const response = await fetch(`${supabaseUrl}/functions/v1/board-upload`, {
    method:'POST',
    headers:{'Content-Type':'application/json', apikey:supabasePublishableKey, Authorization:`Bearer ${supabasePublishableKey}`},

  if (!response.ok) throw new Error(data.error || '게시판 요청에 실패했습니다.');
  return data;
}
async function refreshPublicScratchPosts(){
  if (!supabaseUrl || !supabasePublishableKey) {
    publicBoardStatus = '공개 게시판 백엔드 설정이 필요합니다. 관리자에게 문의해 주세요.';
    publicScratchPosts = [];
  } else {
    try {
      const response = await fetch(`${supabaseUrl}/rest/v1/board_posts?select=id,title,content,created_at,file_path&order=created_at.desc&limit=100`, {
        headers:{apikey:supabasePublishableKey, Authorization:`Bearer ${supabasePublishableKey}`}
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !Array.isArray(data)) throw new Error(data.message || '공개 작품 목록을 불러오지 못했습니다.');
      publicScratchPosts = data
        .filter(p => p && typeof p.id === 'string' && typeof p.title === 'string' && typeof p.content === 'string' && typeof p.file_path === 'string')
        .map(p => ({
          id:`scratch-${p.id}`, k:'game', j:'AI 게임 게시판', name:'스크래치 게임', title:p.title, desc:p.content,
          date:p.created_at ? new Date(p.created_at).toLocaleDateString('ko-KR') : '오늘', likes:0, filePath:p.file_path
        }));
      publicBoardStatus = '스크래치 게임 파일은 모든 방문자에게 공개됩니다. .sb3 파일 최대 50MB · IP 기준 하루 10회 업로드';

      console.error('공개 스크래치 작품을 불러오지 못했습니다.', error);

    }
  }
  const status = $('#boardStatus');
  const posts = $('#boardPosts');
  if (status) status.textContent = publicBoardStatus;
  if (posts && location.hash.replace(/^#\/?/, '').split('/')[0] === 'board') board();

  if (file.size < 4 || file.size > 50 * 1024 * 1024) return toast('파일은 4바이트 이상, 50MB 이하로 올려 주세요.');

      method:'POST',

      throw new Error(data.message || data.error || '파일 업로드에 실패했습니다.');
    }
    await boardRequest({action:'finalize', path:prepared.path, title, content});
    form.reset();
    await refreshPublicScratchPosts();
    filt = 'game'; board();
    toast('스크래치 게임을 AI 게임 게시판에 올렸어요! 🎉');
  } catch(error) {
    console.error('스크래치 게임 업로드에 실패했습니다.', error);
    toast(error.message || '작품을 올리지 못했습니다. 잠시 후 다시 시도해 주세요.');
  } finally {
    button.disabled = false; button.textContent = '🎮 스크래치 게임 올리기';
  }
}
const art = (src, emo) => `<div class="art"><span class="emo">${emo}</span><img src="${src}" alt="" loading="lazy" onerror="this.remove()"></div>`;
const steps = n => `<div class="steps">${['분야 고르기','직업 알아보기','AI 실습하기'].map((s,i)=>`<span class="step ${i+1===n?'now':i+1<n?'done':''}">${i+1<n?'✅':['①','②','③'][i]} ${s}</span>`).join('')}</div>`;
const plain = v => v.replace(/^\S+\s/, '');
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); };

function render(){
  const p = location.hash.replace(/^#\/?/, '').split('/');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', (p[0]==='board') === (b.dataset.n==='board')));
  scrollTo(0, 0);
  if (p[0] === 'board') return board();
  if (p[0] === 'c' && C[p[1]]) return (p[2] !== undefined && C[p[1]].jobs[p[2]]) ? lab(p[1], +p[2]) : jobs(p[1]);
  home();
}

function home(){
  app.innerHTML = `<section class="hero"><img class="bg" src="images/hero.jpg" alt="카메라, 게임패드, 키보드, 태블릿, 슬레이트를 든 다섯 친구들">
    <div class="hero-txt"><span class="hi">👋 안녕, 꼬마 크리에이터!</span>
      <h1>오늘은 어떤<br><em>AI 크리에이터</em>가<br>되어 볼까?</h1>${steps(1)}
      <button class="btn yellow" id="start">🚀 분야 고르러 가기</button></div>
    <div class="bubble"><span>나랑 같이 만들어 보자!</span><img src="images/mascot.svg" alt="마스코트 코코"></div></section>
    <section class="intro"><h2 class="sec-title">🎬 AI 친구 별봇이 들려주는 이야기 <small>먼저 영상을 보고 시작해요!</small></h2>
      <div class="player"><video controls playsinline preload="metadata" poster="images/intro-poster.jpg">
        <source src="images/intro.mp4" type="video/mp4">영상을 재생할 수 없는 브라우저예요.</video></div></section>
    <section class="flow">
      <div><i style="background:#fff1d1">💡</i><span><b>① 내가 생각해요</b><small>재미있는 아이디어 떠올리기</small></span></div>
      <div><i style="background:#ede5ff">🤖</i><span><b>② AI가 만들어요</b><small>주문서로 AI에게 부탁하기</small></span></div>
      <div><i style="background:#ddf7e8">✨</i><span><b>③ 내가 다듬어요</b><small>고치고 꾸며서 내 작품 완성</small></span></div></section>
    <h2 class="sec-title" id="pick">🎯 어떤 분야가 궁금해? <small>16가지 직업이 기다려요</small></h2>
    <section class="pick">${Object.entries(C).map(([k,c]) => `<a class="big" href="#/c/${k}" style="${vars(c)}">
      <span class="tag">${c.emoji} ${c.name}</span><span class="count">직업 4개</span>
      <div class="mosaic">${c.jobs.map((j,i) => art(`images/${k}-job${i+1}.jpg`, j.e)).join('')}</div>
      <div class="txt"><div><h2>${c.name}</h2><p>${c.sub}</p></div><span class="go">→</span></div></a>`).join('')}</section>`;
  $('#start').onclick = () => $('#pick').scrollIntoView({behavior:'smooth'});
}

function jobs(k){
  const c = C[k];
  app.innerHTML = `<div style="${vars(c)}">${steps(2)}<a class="nav-btn back" href="#/">← 처음으로</a>
    <section class="band">${art(`images/${k}-job1.jpg`, c.emoji)}<div><span class="badge">${c.emoji} ${c.name}</span><h1>AI로 ${c.obj} 만드는 사람들</h1>
    <p>궁금한 직업을 눌러 보세요! 그 직업이 되어 <b>${c.tool[0]}</b>로 AI 실습을 할 수 있어요.</p>
    <div class="faces">${c.jobs.map((j,i) => `<img src="images/${k}-job${i+1}.jpg" alt="${j.n}">`).join('')}</div></div></section>
    <section class="jobs">${c.jobs.map((j,i) => `<a class="job" href="#/c/${k}/${i}"><div class="pic"><span class="no">${i+1}</span>${art(`images/${k}-job${i+1}.jpg`, j.e)}</div>
      <div class="body"><h3>${j.n}</h3><p>${j.l}</p><ul>${j.t.map(x=>`<li>${x}</li>`).join('')}</ul>
      <span class="cta">이 직업으로 실습하기 →</span></div></a>`).join('')}</section></div>`;
}

function lab(k, i){
  const c = C[k], j = c.jobs[i], skip = j.skip || [];
  const qs = [...j.g, ...c.g.filter(q => !skip.includes(q.k))];
  const sel = {}, own = {};
  app.innerHTML = `<div style="${vars(c)}">${steps(3)}<a class="nav-btn back" href="#/c/${k}">← 직업 다시 고르기</a>
    <section class="band">${art(`images/${k}-job${i+1}.jpg`, j.e)}<div><span class="badge">${c.emoji} ${c.name} · AI 실습 · 🔗 ${c.tool[0]}</span>
    <h1>오늘 나는 ${j.n}!</h1><p>질문에 답하면서 <b>${c.tool[0]}</b>에게 보낼 <b>주문서(프롬프트)</b>를 만들어 보세요. 마음에 드는 답이 없으면 <b>✏️ 직접 쓰기</b>!</p></div></section>
    <section class="lab"><div class="panel">
      ${qs.map((q,gi) => `<div class="group" data-k="${q.k}"><h3><span class="num">${gi+1}</span>${q.t}${q.multi ? '<small class="multi">여러 개 골라도 돼요</small>' : ''}</h3>
        ${q.o.length ? `<div class="chips">${q.o.map(o=>`<button class="chip" data-v="${o}">${o}</button>`).join('')}<button class="chip mine">✏️ 직접 쓰기</button></div>` : ''}
        <input class="own" ${q.o.length ? 'hidden' : ''} maxlength="120" placeholder="${esc(q.ph || '내 생각을 자유롭게 써 보세요')}"></div>`).join('')}
      <div class="group"><h3><span class="num">${qs.length+1}</span>더 하고 싶은 말 (자유롭게!)</h3>
        <textarea id="extra" rows="3" placeholder="예) 주인공이 마지막에 윙크를 해요"></textarea></div>
    </div>
    <aside class="panel sticky"><h3>🪄 나의 AI 주문서</h3><div class="meter"><span id="bar"></span></div><p class="cnt" id="cnt"></p>
      <div class="prompt" id="out"></div>
      <button class="btn" id="go">🚀 복사하고 ${c.tool[0]} 열기</button>
      <div class="row2 even"><button class="btn ghost" id="copy">📋 복사만</button><button class="btn ghost" id="md">📄 .md 저장</button></div>
      <button class="btn yellow" id="up">🖼️ 완성 작품 게시판에 올리기</button>
      <div class="howto"><b>💡 ${c.tool[0]}에서 이렇게 해요</b><ol>${c.howto.map(h=>`<li>${h}</li>`).join('')}</ol></div>
    </aside></section></div>`;
  const val = q => [...(sel[q.k] || []).map(plain), (own[q.k] || '').trim()].filter(Boolean).join(', ');
  const upd = () => {
    const done = qs.filter(val), ex = $('#extra').value.trim();
    $('#bar').style.width = `${done.length / qs.length * 100}%`;
    $('#cnt').textContent = `${done.length} / ${qs.length}개 질문에 답했어요${done.length === qs.length ? ' 🎉' : ''}`;
    if (!done.length && !ex) { $('#out').textContent = '✍️ 질문에 답하면 여기에 주문서가 만들어져요!'; return ''; }
    const md = [`# ${c.emoji} ${c.name} 주문서 · ${j.n}`, '', '## 🎯 만들어 주세요', j.ask, '', '## 📝 내가 정한 내용',
      ...done.map(q => `- **${q.k}**: ${val(q)}`), ...(ex ? [`- **더 하고 싶은 말**: ${ex}`] : []),
      '', '## ✅ 이렇게 만들어 주세요', ...[...j.out, ...c.rules].map(r => `- ${r}`)].join('\n');
    $('#out').textContent = md;
    return md;
  };
  app.querySelectorAll('.group[data-k]').forEach(g => {
    const q = qs.find(x => x.k === g.dataset.k), inp = g.querySelector('.own');
    g.querySelector('.chips')?.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      if (b.classList.contains('mine')) {
        const on = b.classList.toggle('sel'); inp.hidden = !on;
        if (on) { if (!q.multi) { g.querySelectorAll('.chip[data-v]').forEach(x => x.classList.remove('sel')); sel[q.k] = []; } inp.focus(); }
        else { inp.value = ''; own[q.k] = ''; }
        return upd();
      }
      const on = b.classList.contains('sel');
      if (!q.multi) { g.querySelectorAll('.chip').forEach(x => x.classList.remove('sel')); inp.hidden = true; inp.value = ''; own[q.k] = ''; }
      b.classList.toggle('sel', !on);
      sel[q.k] = [...g.querySelectorAll('.chip[data-v].sel')].map(x => x.dataset.v);
      upd();
    });
    inp.addEventListener('input', () => { own[q.k] = inp.value; upd(); });
  });
  $('#extra').addEventListener('input', upd); upd();
  const copy = t => navigator.clipboard.writeText(t);
  $('#copy').onclick = () => { const t = upd(); if (!t) return toast('질문에 먼저 답해 주세요!');
    copy(t).then(() => toast('복사 완료! AI 도구에 붙여넣어 보세요 ✨')).catch(() => toast('글자를 길게 눌러 복사해 주세요')); };
  $('#go').onclick = () => { const t = upd(); if (!t) return toast('질문에 먼저 답해 주세요!');
    copy(t).then(() => toast(`복사 완료! ${c.tool[0]}에 붙여넣어요 ✨`)).catch(() => toast('복사가 안 됐어요. 📋 복사만 버튼을 눌러 주세요'));
    const w = open(c.tool[1], '_blank');
    if (w) w.opener = null; else toast('새 창이 막혔어요. 팝업을 허용해 주세요'); };
  $('#md').onclick = () => { const t = upd(); if (!t) return toast('질문에 먼저 답해 주세요!');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], {type:'text/markdown'}));
    a.download = `주문서-${j.n.replace(/[^\w가-힣]+/g,'')}.md`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('주문서 파일을 저장했어요 📄'); };
  $('#up').onclick = () => openUpload(k, i, upd());
}

let filt = 'all';
function board(){
  const list = [...publicScratchPosts, ...load()], liked = load(LIKED), shown = list.filter(p => filt === 'all' || p.k === filt);
  const cats = [['all','🌟 전체'], ...Object.entries(C).map(([k,c]) => [k, `${c.emoji} ${c.name}`])];
  app.innerHTML = `<section class="board-head"><div><h1>🏆 우리들의 AI 작품 전시관</h1>
    <p>친구들이 AI와 함께 만든 작품을 구경하고 ❤️로 응원해 주세요!</p></div>
    <button class="btn yellow" id="up2">✏️ 작품 올리기</button></section>
    <div class="filters">${cats.map(([k,t]) => `<button class="chip ${filt===k?'sel':''}" data-f="${k}">${t} (${k==='all'?list.length:list.filter(p=>p.k===k).length})</button>`).join('')}</div>
    <form class="scratch-upload" id="scratchUploadForm">
      <h2>🎮 AI 게임 게시판에 Scratch 게임 올리기</h2>
      <p>올린 작품과 .sb3 파일은 모두에게 공개되고 내려받을 수 있어요. 파일 크기는 최대 50MB, IP 기준 하루 10회까지예요.</p>
      <div><label for="scratchTitle">작품 제목</label><input id="scratchTitle" maxlength="50" required placeholder="예: 별을 모으는 용용이"></div>
      <div><label for="scratchContent">작품 소개</label><textarea id="scratchContent" rows="2" maxlength="500" required placeholder="게임의 재미있는 점을 소개해 주세요."></textarea></div>
      <div class="file-field"><label for="scratchFile">Scratch 파일 (.sb3)</label><input id="scratchFile" type="file" accept=".sb3,application/x.scratch.sb3" required></div>
      <button type="submit">🎮 스크래치 게임 올리기</button>
      <span class="board-status" id="boardStatus">${esc(publicBoardStatus)}</span>
    </form>
    <section class="posts" id="boardPosts">${shown.length ? shown.map(p => post(p, liked.includes(p.id))).join('') : `<div class="empty">아직 작품이 없어요 🥲<br>첫 번째 작품의 주인공이 되어 보세요!</div>`}</section>`;
  $('#scratchUploadForm').addEventListener('submit', uploadScratchProject);
}
function post(p, isLiked){
  const c = C[p.k] || C.art;
  const downloadUrl = p.filePath
    ? `${supabaseUrl}/storage/v1/object/public/scratch-projects/${encodeURIComponent(p.filePath)}?download=${encodeURIComponent(`${p.title}.sb3`)}`
    : '';
  return `<article class="post" style="${vars(c)}">${p.img ? `<img src="${p.img}" alt="${esc(p.title)}">` : `<div class="noimg">${c.emoji}</div>`}
    <div class="pb"><span class="badge">${c.emoji} ${esc(p.j || c.name)}</span><h3>${esc(p.title)}</h3>
    <div class="by">✏️ ${esc(p.name)} · ${esc(p.date)}</div>${p.desc ? `<p>${esc(p.desc)}</p>` : ''}
    ${p.prompt ? `<details><summary>🪄 사용한 주문서 보기</summary><pre>${esc(p.prompt)}</pre></details>` : ''}
    ${downloadUrl ? `<a class="post-download" href="${esc(downloadUrl)}" target="_blank" rel="noopener noreferrer">⬇️ Scratch 파일 다운로드 (.sb3)</a>` : `<div class="row"><button class="like ${isLiked?'done':''}" data-like="${p.id}">❤️ ${p.likes}</button><button class="del" data-del="${p.id}">삭제</button></div>`}</div></article>`;
}
app.addEventListener('click', e => {
  const t = e.target.closest('[data-f],[data-like],[data-del],#up2'); if (!t) return;
  if (t.dataset.f) { filt = t.dataset.f; return board(); }
  if (t.id === 'up2') return openUpload(filt === 'all' ? 'video' : filt, null, '');
  const list = load();
  if (t.dataset.like) {
    const id = +t.dataset.like, liked = load(LIKED), p = list.find(x => x.id === id);
    if (liked.includes(id)) return toast('이미 응원했어요 💖');
    p.likes++; liked.push(id); save(list); save(liked, LIKED); return board();
  }
  if (t.dataset.del) {
    if (prompt('선생님 비밀번호를 입력하세요') !== TEACHER_PIN) return toast('비밀번호가 달라요');
    save(list.filter(x => x.id !== +t.dataset.del)); board(); toast('삭제했어요');
  }
});

let draft = {}, img = '';
$('#fCat').innerHTML = Object.entries(C).map(([k,c]) => `<option value="${k}">${c.emoji} ${c.name}</option>`).join('');
function openUpload(k, i, prompt){
  draft = {k, i, prompt}; img = ''; $('#form').reset(); $('#fCat').value = k;
  $('#dropTxt').innerHTML = '📷 여기를 눌러 작품 이미지를 골라요';
  $('#modal').classList.add('open');
}
$('#cancel').onclick = () => $('#modal').classList.remove('open');
$('#file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const s = Math.min(1, 900 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
    cv.width = im.width * s; cv.height = im.height * s; cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    img = cv.toDataURL('image/jpeg', .75); $('#dropTxt').innerHTML = `<img src="${img}">`;
  }; im.src = r.result; };
  r.readAsDataURL(f);
};
$('#form').onsubmit = e => {
  e.preventDefault();
  const k = $('#fCat').value, list = load();
  const j = (draft.i !== null && draft.k === k) ? C[k].jobs[draft.i].n : C[k].name;
  list.unshift({id: Date.now(), k, j, name: $('#fName').value.trim(), title: $('#fTitle').value.trim(), desc: $('#fDesc').value.trim(),
    prompt: draft.prompt || '', img, date: new Date().toLocaleDateString('ko-KR'), likes: 0});
  try { save(list); } catch (err) { return toast('저장 공간이 꽉 찼어요. 더 작은 이미지를 골라 주세요'); }
  $('#modal').classList.remove('open'); filt = 'all'; toast('게시판에 올렸어요! 🎉'); location.hash = '#/board';
};
addEventListener('hashchange', render); render(); refreshPublicScratchPosts();
</script>
