<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <title>AI Contents designer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25324a;
      --muted: #69758a;
      --paper: #fffdf8;
      --line: #eee8dc;
      --purple: #8063e8;
      --pink: #ff8fa3;
      --yellow: #ffcb58;
      --mint: #74d8bc;
      --blue: #74b8f2;
      --shadow: 0 16px 45px rgba(59, 54, 91, .10);
      font-family: "Trebuchet MS", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(ellipse at 8% 6%, rgba(255, 223, 147, .23), transparent 26rem),
        radial-gradient(ellipse at 95% 12%, rgba(208, 194, 255, .24), transparent 27rem),
        #fffaf2;
      color: var(--ink);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(128, 99, 232, .45);
      outline-offset: 3px;
    }
    .shell { width: min(1120px, calc(100% - 40px)); margin: auto; }
    header { height: 78px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: -.03em; }
    .brand-bot { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 13px; background: #eee8ff; font-size: 21px; }
    .nav-actions { display: flex; gap: 9px; }
    .quiet-button, .back-button {
      border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px;
      background: rgba(255,255,255,.76); color: var(--ink); font-weight: 800;
    }
    .quiet-button:hover, .back-button:hover { border-color: #c9bdfa; background: white; }
    main { min-height: calc(100vh - 145px); padding-bottom: 50px; }
    .hero {
      position: relative; overflow: hidden; min-height: 340px; margin: 22px 0 34px;
      display: grid; grid-template-columns: 1.2fr .8fr; align-items: center;
      padding: 48px 7%; border: 1px solid rgba(255,255,255,.9); border-radius: 34px;
      background: linear-gradient(115deg, #fff0cc 0%, #fff2f3 48%, #f0eaff 100%);
      box-shadow: var(--shadow);
    }
    .hero::before, .hero::after { content: "✦"; position: absolute; color: #f3b947; opacity: .8; }
    .hero::before { right: 42%; top: 18%; font-size: 22px; }
    .hero::after { right: 8%; top: 18%; font-size: 16px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.75); color: #7856d9; font-size: 12px; font-weight: 900; }
    h1 { max-width: 570px; margin: 17px 0 13px; font-size: clamp(37px, 6vw, 65px); line-height: .98; letter-spacing: -.065em; }
    .hero-copy { max-width: 435px; color: #5d6678; font-size: 16px; line-height: 1.75; }
    .hero-visual { display: grid; place-items: center; min-height: 220px; }
    .bot-scene { position: relative; width: 220px; height: 205px; display: grid; place-items: center; }
    .bot-orbit { position: absolute; width: 190px; height: 190px; border: 2px dashed rgba(128,99,232,.25); border-radius: 50%; }
    .big-bot { z-index: 1; width: 133px; height: 122px; border-radius: 38px 38px 32px 32px; background: linear-gradient(145deg, #a993ff, #8063e8); border: 6px solid #fff; box-shadow: 0 16px 26px rgba(93,71,177,.22); position: relative; transform: rotate(-4deg); }
    .big-bot::before { content: ""; position: absolute; width: 83px; height: 43px; left: 19px; top: 30px; border-radius: 22px; background: #fff; }
    .big-bot::after { content: "●   ●"; white-space: pre; position: absolute; color: #6451ad; left: 38px; top: 39px; font-size: 14px; letter-spacing: 5px; }
    .antenna { position: absolute; width: 7px; height: 23px; left: 62px; top: -24px; background: #8063e8; border-radius: 8px; }
    .antenna::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #ffcb58; top: -9px; left: -4px; }
    .cheek { position: absolute; width: 13px; height: 7px; border-radius: 50%; background: #ff9bad; top: 80px; left: 24px; }
    .cheek.right { left: auto; right: 24px; }
    .floaty { position: absolute; font-size: 31px; }
    .floaty.one { top: 8px; left: 1px; }.floaty.two { bottom: 5px; right: 1px; }.floaty.three { top: 31px; right: 8px; font-size: 22px; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin: 0 3px 17px; }
    .section-heading h2 { margin: 0 0 6px; font-size: 25px; letter-spacing: -.04em; }
    .section-heading p { margin: 0; color: var(--muted); font-size: 14px; }
    .count-pill { background: #f0eaff; color: #7055d4; padding: 8px 12px; border-radius: 999px; font-weight: 900; font-size: 12px; white-space: nowrap; }
    .career-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .career-card {
      min-height: 230px; border: 1px solid rgba(255,255,255,.9); border-radius: 25px; padding: 20px;
      text-align: left; color: var(--ink); box-shadow: 0 9px 26px rgba(59,54,91,.07);
      transition: transform .2s, box-shadow .2s; position: relative; overflow: hidden;
    }
    .career-card:hover { transform: translateY(-5px) rotate(-.5deg); box-shadow: var(--shadow); }
    .career-card::after { content: ""; position: absolute; width: 130px; height: 130px; border-radius: 50%; right: -37px; top: -40px; background: rgba(255,255,255,.35); }
    .career-card.game { background: #e7f7ef; }.career-card.video { background: #fff0ed; }
    .career-card.song { background: #fff4d9; }.career-card.art { background: #eeeaff; }
    .card-icon { width: 68px; height: 68px; display: grid; place-items: center; border-radius: 22px; background: rgba(255,255,255,.75); font-size: 36px; margin-bottom: 19px; }
    .card-title { display: block; font-size: 19px; font-weight: 900; margin-bottom: 6px; letter-spacing: -.04em; }
    .card-description { color: #69758a; font-size: 12px; line-height: 1.55; }
    .card-arrow { position: absolute; right: 19px; bottom: 17px; font-weight: 900; color: #7862c7; }
    .board-section { margin-top: 55px; }
    .board-tools { display: flex; gap: 8px; }
    .filter-button { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: #fff; color: var(--muted); font-weight: 800; font-size: 12px; }
    .filter-button.active { background: var(--ink); color: white; border-color: var(--ink); }
    .board-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .post-card { min-height: 185px; padding: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 21px; box-shadow: 0 7px 20px rgba(59,54,91,.045); }
    .post-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .post-category { border-radius: 999px; padding: 6px 9px; background: #f0eaff; color: #7157cc; font-size: 11px; font-weight: 900; }
    .post-card[data-category="game"] .post-category { background: #e7f7ef; color: #39896c; }
    .post-card[data-category="video"] .post-category { background: #fff0ed; color: #dc7168; }
    .post-card[data-category="song"] .post-category { background: #fff4d9; color: #a47a20; }
    .post-date { color: #9ba3af; font-size: 11px; }
    .post-card h3 { margin: 14px 0 7px; font-size: 17px; }
    .post-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty-board { grid-column: 1/-1; text-align: center; padding: 35px; color: var(--muted); border: 1px dashed #ded7ca; border-radius: 20px; background: rgba(255,255,255,.5); }
    .detail-page { padding-top: 22px; }
    .detail-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .detail-layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: 20px; align-items: start; }
    .info-panel, .studio-panel { border-radius: 28px; border: 1px solid rgba(255,255,255,.95); box-shadow: var(--shadow); background: white; padding: clamp(21px, 4vw, 34px); }
    .info-panel { position: sticky; top: 18px; }
    .field-badge { font-size: 52px; margin-bottom: 10px; }
    .info-panel h2 { margin: 0 0 10px; font-size: clamp(27px, 4vw, 38px); letter-spacing: -.055em; }
    .info-panel > p { color: var(--muted); line-height: 1.75; }
    .job-box { margin-top: 22px; padding: 18px; border-radius: 19px; background: #f7f4ff; }
    .job-box h3 { margin: 0 0 8px; font-size: 14px; }.job-box p { margin: 0; font-size: 13px; color: #657086; line-height: 1.7; }
    .sparkle-note { margin-top: 15px; color: #735bc7; font-size: 12px; font-weight: 800; line-height: 1.65; }
    .studio-panel h2 { margin: 0 0 5px; font-size: 23px; }.studio-panel .intro { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .field { display: block; margin: 15px 0; }
    .field label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 900; }
    .field input, .field textarea { width: 100%; padding: 12px 14px; border-radius: 13px; border: 1px solid #e9e5de; background: #fffdfa; color: var(--ink); }
    .field textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
    .prompt-hint { margin-top: 6px; color: #8992a1; font-size: 11px; }
    .primary-button { width: 100%; border: 0; border-radius: 14px; padding: 14px 16px; color: white; background: linear-gradient(100deg, #8063e8, #a184ee); font-weight: 900; box-shadow: 0 7px 16px rgba(128,99,232,.22); }
    .primary-button:hover { filter: brightness(1.05); }
    .preview-box { margin-top: 18px; padding: 17px; border: 1px dashed #d9d1f5; border-radius: 18px; background: #faf8ff; }
    .preview-box[hidden] { display: none; }.preview-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 10px; }
    .preview-head strong { font-size: 13px; }.demo-label { color: #8063e8; font-size: 10px; font-weight: 900; }
    .preview-output { color: #5f6b80; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .preview-visual { margin: 10px 0; min-height: 80px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(120deg,#e9f8f4,#f0eaff); font-size: 35px; }
    .artwork-preview, .video-preview { display: block; width: 100%; margin: 10px 0; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .video-controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 9px 0; }
    .video-controls button, .video-controls a { border: 0; border-radius: 999px; padding: 9px 13px; background: #8063e8; color: white; text-decoration: none; font-size: 12px; font-weight: 900; }
    .video-controls a { background: #e9e4fb; color: #6752b3; }
    .api-status { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0; padding: 11px 13px; border-radius: 13px; background: #f3f5fa; color: #68758b; font-size: 12px; line-height: 1.55; }
    .api-status.ready { background: #eaf8f1; color: #347b61; }.api-status.error { background: #fff0ed; color: #b65349; }
    .loading-dots { display: inline-block; animation: loading-pulse 1s infinite alternate; }
    @keyframes loading-pulse { to { opacity: .35; } }
    .preview-actions { display: flex; gap: 8px; margin-top: 14px; }
    .preview-actions button { flex: 1; border: 1px solid #ded8f2; border-radius: 11px; padding: 10px; background: white; color: #6f59c0; font-size: 12px; font-weight: 900; }
    .game-demo { margin-top: 12px; padding: 16px; border-radius: 15px; background: #e9f8f1; text-align: center; }
    .game-demo button { border: 0; border-radius: 999px; background: white; padding: 11px 16px; font-weight: 900; color: #39896c; }
    .game-score { display: block; margin: 9px 0 0; font-size: 12px; color: #537365; }
    .audio-demo { margin-top: 10px; border: 1px solid #eee5cd; border-radius: 13px; padding: 11px; background: #fffaf0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .audio-demo button { border: 0; border-radius: 999px; padding: 8px 10px; background: #ffcb58; color: #664c14; font-weight: 900; }
    .toast { position: fixed; z-index: 10; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 12px 18px; background: #25324a; color: white; border-radius: 999px; font-size: 13px; font-weight: 800; transition: .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    footer { border-top: 1px solid rgba(238,232,220,.8); padding: 20px 0 28px; text-align: center; color: #8a93a2; font-size: 11px; line-height: 1.7; }
    @media (max-width: 850px) {
      .career-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-layout { grid-template-columns: 1fr; }.info-panel { position: static; }
      .board-grid { grid-template-columns: repeat(2, 1fr); }
      .hero { padding: 38px 6%; }.hero-visual { transform: scale(.85); }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 26px, 480px); }
      header { height: 65px; }.brand { font-size: 13px; }.brand-bot { width: 31px; height: 31px; }
      .quiet-button { padding: 9px 11px; font-size: 12px; }
      .hero { grid-template-columns: 1fr; min-height: auto; padding: 30px 25px 10px; margin: 15px 0 29px; border-radius: 26px; }
      .hero-copy { font-size: 14px; }.hero-visual { min-height: 160px; transform: scale(.75); margin-top: -8px; }
      .career-grid { gap: 10px; }.career-card { min-height: 192px; padding: 15px; border-radius: 20px; }
      .card-icon { width: 57px; height: 57px; font-size: 30px; margin-bottom: 14px; border-radius: 18px; }
      .card-title { font-size: 16px; }.card-description { font-size: 11px; }
      .section-heading h2 { font-size: 21px; }.section-heading p { font-size: 12px; }
      .board-section { margin-top: 42px; }.board-grid { grid-template-columns: 1fr; }
      .section-heading.board-heading { align-items: start; flex-direction: column; }
      .detail-toolbar { gap: 8px; }.detail-layout { gap: 13px; }
      .info-panel, .studio-panel { border-radius: 22px; padding: 21px; }
      .post-card { min-height: 145px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="shell">
    <div class="brand"><span class="brand-bot" aria-hidden="true">🤖</span><span>꼬마 AI 창작 연구소</span></div>
    <nav class="nav-actions" aria-label="주 메뉴">
      <button class="quiet-button" id="homeButton" type="button">🏠 처음으로</button>
      <button class="quiet-button" id="boardButton" type="button">📌 작품 게시판</button>
    </nav>
  </header>
  <main class="shell" id="app"></main>
  <footer class="shell">
    <strong>AI Contents designer</strong> · 아이디어는 내가, 멋진 상상은 함께!<br>
    게임·노래·영상 스토리보드·그림은 Gemini가 아이디어를 바탕으로 생성해요. 그림은 SVG, 영상은 브라우저 애니메이션으로 만들어져요.
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./supabase-config.js"></script>
  <script>
    (() => {
      const fields = {
        game: {
          title: "AI로 만드는 게임", job: "게임 디자이너", icon: "🕹️", button: "🎮 게임 만들기",
          short: "상상 속 규칙과 캐릭터로 나만의 게임을 만들어요.",
          description: "게임 디자이너는 어떤 놀이를 만들지 상상하고, 규칙과 캐릭터를 정해 사람들이 재미있게 즐길 수 있도록 만들어요.",
          jobInfo: "게임 디자이너는 이야기 작가, 그림 작가, 개발자와 함께 일해요. AI에게 아이디어를 물어보고, 사람에게 재미있는지 직접 시험하며 고쳐요.",
          prompt: "구름 위에서 별을 모으는 고양이",
          hint: "누가 주인공인지, 무엇을 하면 재미있을지 적어보세요.",
          output: (idea) => `🌟 게임 아이디어\n${idea}을(를) 주제로 해요.\n\n목표: 반짝이는 아이템을 모으고 장애물을 피해요!\n규칙: 아이템을 누르면 점수가 1점 올라가요.\n다음 단계: 주인공과 게임 배경을 그려 보세요.`,
          visual: "🐱　☁️　⭐　☁️",
          demo: "game"
        },
        video: {
          title: "AI로 만드는 영상", job: "영상 감독", icon: "🎬", button: "🎥 영상 만들기",
          short: "짧은 이야기와 장면을 이어서 영상으로 표현해요.",
          description: "영상 감독은 어떤 이야기를 보여줄지 정하고, 장면·대사·음악을 골라 재미있고 알기 쉬운 영상으로 만들어요.",
          jobInfo: "영상 감독은 촬영 감독, 배우, 편집자와 함께 일해요. AI와 장면 아이디어를 나누고, 영상의 순서를 직접 계획하고 다듬어요.",
          prompt: "바닷속에서 보물을 찾는 아기 거북이",
          hint: "주인공과 장소, 일어나는 일을 짧게 써보세요.",
          output: (idea) => `🎞️ 나의 3장면 이야기\n\n장면 1 · 시작\n${idea}의 첫 장면! 넓은 풍경을 보여줘요.\n\n장면 2 · 모험\n주인공이 새로운 친구를 만나 함께 문제를 해결해요.\n\n장면 3 · 마무리\n모두 힘을 모아 멋진 결말을 만들어요!`,
          visual: "🎬　🌊　🐢　✨",
          demo: "video"
        },
        song: {
          title: "AI로 만드는 노래", job: "작곡가", icon: "🎵", button: "🎹 노래 만들기",
          short: "기분과 단어를 골라 나만의 노랫말을 지어요.",
          description: "작곡가는 마음을 움직이는 멜로디와 가사를 만들어요. 신나는 노래, 조용한 노래처럼 느낌에 맞는 소리를 골라요.",
          jobInfo: "작곡가는 가수와 연주자, 작사가와 함께 노래를 만들어요. AI가 떠올린 단어도 참고하고, 어떤 노래를 들려줄지 직접 결정해요.",
          prompt: "친구와 함께 떠나는 신나는 우주 여행",
          hint: "노래에 꼭 넣고 싶은 이야기나 단어를 적어보세요.",
          output: (idea) => `🎶 ${idea}\n\n반짝반짝 별빛 따라\n두근두근 마음 모아\n손을 잡고 날아가자\n우리의 꿈을 찾아서!\n\n(후렴) 라라라, 신나는 오늘\n라라라, 함께 부르자!`,
          visual: "🎤　🎼　🎹　🎶",
          demo: "song"
        },
        art: {
          title: "AI로 만드는 그림", job: "일러스트레이터", icon: "🎨", button: "🖌️ 그림 만들기",
          short: "색과 모양으로 머릿속 이야기를 그림으로 그려요.",
          description: "일러스트레이터는 책이나 게임에 들어갈 그림을 그려요. 색, 표정, 배경을 정해 머릿속 상상을 눈에 보이게 표현해요.",
          jobInfo: "일러스트레이터는 작가, 디자이너와 함께 그림을 만들어요. AI에게 원하는 그림을 말로 설명해 보고, 마음에 드는 부분을 골라 발전시켜요.",
          prompt: "보라색 우주복을 입고 달에서 춤추는 토끼",
          hint: "무엇을 그릴지, 어떤 색과 분위기인지 적어보세요.",

      const videoPalettes = {
        ocean: ["#b8e7f5", "#4a9bb8"], sunset: ["#ffd3a8", "#e87c83"], forest: ["#cce8c5", "#5d9b72"],
        space: ["#d8c9ff", "#8063c9"], candy: ["#ffd5e5", "#e783b1"], sunny: ["#fff0a8", "#e7a93c"]
      };
      const subjectColors = { coral: "#ff8b79", gold: "#f2c14e", mint: "#69c6a5", violet: "#9575cd", blue: "#64a9e8", pink: "#ec8bb5" };
      function artworkDataUrl(art, title) {
        const [background, accent] = videoPalettes[art.background] || videoPalettes.sunset;
        const subject = subjectColors[art.subjectColor] || subjectColors.violet;
        const detail = subjectColors[art.accentColor] || subjectColors.gold;
        const decorations = art.details.map((item, index) => {
          const x = 100 + (index * 137) % 440;
          const y = 95 + (index * 89) % 180;
          return `<circle cx="${x}" cy="${y}" r="18" fill="${detail}" opacity=".76"/><text x="${x}" y="${y + 7}" text-anchor="middle" font-size="17">${escapeXml(item.slice(0, 6))}</text>`;
        }).join("");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="${background}"/><stop offset="1" stop-color="${accent}"/></linearGradient></defs><rect width="640" height="440" rx="32" fill="url(#bg)"/><circle cx="320" cy="215" r="112" fill="${subject}" opacity=".88"/><circle cx="320" cy="215" r="92" fill="#fff" opacity=".3"/>${decorations}<text x="320" y="250" text-anchor="middle" font-size="96">${escapeXml(art.subjectEmoji)}</text><rect x="28" y="350" width="584" height="62" rx="20" fill="#fff" opacity=".86"/><text x="320" y="378" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#25324a">${escapeXml(title.slice(0, 35))}</text><text x="320" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#596579">${escapeXml(art.description.slice(0, 52))}</text></svg>`;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }
      function paintVideoFrame(canvas, video, title, elapsed) {
        const context = canvas.getContext("2d");
        if (!context) throw new Error("영상 미리보기를 그릴 수 없습니다.");
        const scenes = video.scenes;
        const sceneDuration = 2200;
        const sceneIndex = Math.floor(elapsed / sceneDuration) % scenes.length;
        const scene = scenes[sceneIndex];
        const [from, to] = videoPalettes[scene.palette] || videoPalettes.ocean;
        const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, from);
        gradient.addColorStop(1, to);
        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "rgba(255,255,255,.32)";
        for (let index = 0; index < 7; index += 1) {
          const x = ((index * 113 + elapsed * (0.012 + index * 0.001)) % (canvas.width + 70)) - 35;
          const y = 44 + (index * 47) % 240;
          context.beginPath();
          context.arc(x, y, 16 + index % 3 * 7, 0, Math.PI * 2);
          context.fill();
        }
        context.textAlign = "center";
        context.fillStyle = "#25324a";
        context.font = "700 23px sans-serif";
        context.fillText(`${sceneIndex + 1} / ${scenes.length} · ${scene.setting}`, canvas.width / 2, 42, 580);
        context.font = "112px sans-serif";
        context.fillText(scene.emoji, canvas.width / 2, 205 + Math.sin(elapsed / 230) * 9);
        context.font = "600 19px sans-serif";
        context.fillText(scene.action, canvas.width / 2, 255, 580);
        context.fillStyle = "rgba(255,255,255,.9)";
        context.fillRect(28, 294, canvas.width - 56, 46);
        context.fillStyle = "#25324a";
        context.font = "16px sans-serif";
        context.fillText(scene.narration, canvas.width / 2, 323, 560);
        context.font = "700 16px sans-serif";
        context.fillText(title.slice(0, 40), canvas.width / 2, 380, 580);
      }
      function startVideoPreview() {
        const canvas = document.getElementById("videoCanvas");
        if (!canvas || !currentPreview) return;
        const startedAt = performance.now();
        const animate = (now) => {
          if (!canvas.isConnected || !currentPreview) return;
          paintVideoFrame(canvas, currentPreview.result, currentPreview.title, now - startedAt);
          videoAnimationFrame = requestAnimationFrame(animate);
        };
        videoAnimationFrame = requestAnimationFrame(animate);
      }
      function stopVideoRecording() {
        window.clearTimeout(videoRecordingTimer);
        cancelVideoDownload = true;
        if (videoRecorder && videoRecorder.state !== "inactive") {
          videoRecorder.stop();
        }
        videoRecorder = null;
      }
      function createVideoDownload() {
        if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
          showToast("이 브라우저는 영상 파일 저장을 지원하지 않아요. 다른 최신 브라우저에서 시도해 주세요.");
          return;
        }
        const canvas = document.getElementById("videoCanvas");
        if (!canvas) return;
        cancelAnimationFrame(videoAnimationFrame);
        const stream = canvas.captureStream(12);
        const mimeType = typeof MediaRecorder.isTypeSupported === "function"
          ? ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((type) => MediaRecorder.isTypeSupported(type))
          : "";
        try {
          videoRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        } catch (error) {
          stream.getTracks().forEach((track) => track.stop());
          console.error("영상 녹화를 시작하지 못했습니다.", error);
          showToast("영상 저장을 시작할 수 없어요. 브라우저 설정을 확인해 주세요.");
          return;
        }
        cancelVideoDownload = false;
        const chunks = [];
        const button = document.getElementById("downloadVideo");
        button.disabled = true;
        button.textContent = "⏳ 영상을 만들고 있어요…";
        videoRecorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
        videoRecorder.onerror = (event) => {
          console.error("영상 녹화 중 오류가 발생했습니다.", event.error);
          showToast("영상 파일을 만들지 못했어요. 다시 시도해 주세요.");
        };
        videoRecorder.onstop = () => {
          stream.getTracks().forEach((track) => track.stop());
          button.disabled = false;
          button.textContent = "🎬 다시 만들기";
          if (cancelVideoDownload) return;
          const blob = new Blob(chunks, { type: videoRecorder?.mimeType || "video/webm" });
          if (!blob.size) return showToast("영상 파일이 비어 있어요. 다시 시도해 주세요.");
          const url = URL.createObjectURL(blob);
          const link = document.getElementById("downloadVideoLink");
          if (link) {
            link.href = url;
            link.download = `${currentPreview.title.replace(/[\\/:*?"<>|]/g, "-")}.webm`;
            link.hidden = false;
            link.textContent = "⬇️ 영상 다운로드 (WebM)";
            link.click();
          } else {
            const download = document.createElement("a");
            download.href = url;
            download.download = "ai-contents-video.webm";
            download.click();
          }
          window.setTimeout(() => URL.revokeObjectURL(url), 60_000);
          showToast("AI 장면으로 영상 파일을 만들었어요!");
          startVideoPreview();
        };
        videoRecorder.start();
        const startedAt = performance.now();
        const renderRecording = (now) => {
          if (!canvas.isConnected || !currentPreview || !videoRecorder || videoRecorder.state !== "recording") return;
          paintVideoFrame(canvas, currentPreview.result, currentPreview.title, now - startedAt);
          videoAnimationFrame = requestAnimationFrame(renderRecording);
        };
        videoAnimationFrame = requestAnimationFrame(renderRecording);
        videoRecordingTimer = window.setTimeout(() => {
          if (videoRecorder && videoRecorder.state === "recording") videoRecorder.stop();
        }, currentPreview.result.scenes.length * 2200);
      }
      function playGeneratedMelody(song) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return showToast("이 브라우저에서는 멜로디 재생을 지원하지 않아요.");
        const button = document.getElementById("playSong");
        const context = new AudioContextClass();
        const notes = Array.isArray(song.notes) ? song.notes.slice(0, 16) : [];
        if (!notes.length) {
          context.close();
          return showToast("만든 멜로디를 찾지 못했어요. 다시 생성해 주세요.");
        }
        const beat = 60 / Math.max(60, Math.min(160, Number(song.bpm) || 100));
        button.disabled = true;
        button.textContent = "♪ 재생 중";
        context.resume().then(() => {
          notes.forEach((note, index) => {
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            const midi = Math.max(60, Math.min(84, Number(note) || 60));
            oscillator.type = "sine";
            oscillator.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
            gain.gain.setValueAtTime(0.0001, context.currentTime + index * beat);
            gain.gain.exponentialRampToValueAtTime(0.12, context.currentTime + index * beat + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + index * beat + beat * 0.75);
            oscillator.connect(gain);
            gain.connect(context.destination);
            oscillator.start(context.currentTime + index * beat);
            oscillator.stop(context.currentTime + index * beat + beat * 0.8);
          });
          window.setTimeout(() => {
            button.disabled = false;
            button.textContent = "▶ 다시 듣기";
            context.close();
          }, notes.length * beat * 1000 + 150);
        }).catch((error) => {
          context.close();
          button.disabled = false;
          button.textContent = "▶ 들어보기";
          console.error("멜로디 재생에 실패했습니다.", error);
          showToast("멜로디 재생을 시작할 수 없어요.");
        });
      }
      document.getElementById("homeButton").addEventListener("click", () => {
        activeFilter = "all";
        renderHome();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      document.getElementById("boardButton").addEventListener("click", () => {
        if (!activeField) document.getElementById("board")?.scrollIntoView({ behavior: "smooth" });
        else {
          renderHome(true);
        }
      });
      renderHome();
    })();
  </script>
